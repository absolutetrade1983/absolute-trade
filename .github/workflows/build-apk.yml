name: Build Absolute Trade APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create /tmp/absolute_trade \
            --project-name absolute_trade \
            --org com.absolutetrade \
            --platforms android
          cp -R /tmp/absolute_trade/. .

      - name: Create app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const AbsoluteTrade());
          }

          class AbsoluteTrade extends StatelessWidget {
            const AbsoluteTrade({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Absolute Trade',
                theme: ThemeData.dark(),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            static const categories = [
              'Index FUT',
              'Index Option',
              'Stock FUT',
              'Stock Option',
              'MCX FUT',
              'MCX Option',
              'Crypto',
              'Forex',
              'Comex',
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF080808),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF080808),
                  title: const Text(
                    'ABSOLUTE TRADE',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      letterSpacing: 1.5,
                    ),
                  ),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: GridView.builder(
                    itemCount: categories.length,
                    gridDelegate:
                        const SliverGridDelegateWithFixedCrossAxisCount(
                      crossAxisCount: 2,
                      crossAxisSpacing: 12,
                      mainAxisSpacing: 12,
                      childAspectRatio: 1.45,
                    ),
                    itemBuilder: (context, index) {
                      return Card(
                        color: const Color(0xFF151515),
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Center(
                          child: Text(
                            categories[index],
                            textAlign: TextAlign.center,
                            style: const TextStyle(
                              fontSize: 17,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: absolute-trade-apk
          path: build/app/outputs/flutter-apk/app-release.apk